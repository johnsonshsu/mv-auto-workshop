# 硬體門檻（單位 GB）
# 低於 min → 不通過；介於 min 與 recommended → 可執行但需降規；達到 recommended → 通過。
# 標示「待實測」的數字是保守估計，會在對應的開發階段以實際執行結果修正。

[yue2]
label = "YuE2 歌曲生成"
min_vram = 8
recommended_vram = 12
min_ram = 16
recommended_ram = 32
source = "待實測。yue2_3b_int8_convrot 檔案約 3.7 GB（官方範本說明）"

[infinitetalk]
label = "InfiniteTalk 對嘴"
